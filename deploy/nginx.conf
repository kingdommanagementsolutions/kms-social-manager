# Reverse proxy for KMS Social Manager at http://<server-ip>/kms-social-dashboard/
# nginx strips the prefix, so the app itself sees plain paths.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 200m;       # media uploads
    proxy_request_buffering off;     # stream uploads to the app

    location = /kms-social-dashboard { return 301 /kms-social-dashboard/; }

    location /kms-social-dashboard/ {
        proxy_pass http://127.0.0.1:3000/;   # trailing slash = strip the prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = / { return 302 /kms-social-dashboard/; }
}
